# Create a GitHub release whenever a version tag is pushed. Zenodo archives
# the release and mints the DOI.
on:
  push:
    tags: ['v*']

name: release.yaml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches DESCRIPTION version
        run: |
          desc=$(sed -n 's/^Version: *//p' DESCRIPTION)
          if [ "v$desc" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match DESCRIPTION version $desc"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
